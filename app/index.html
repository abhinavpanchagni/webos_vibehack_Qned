<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Home — Cinema</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 <main id="shell">
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
   <defs>
    <!-- Bloom only at the alpha contour: keep faces and clothing sharp. -->
    <filter id="characterBloom" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
     <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="soft"/>
     <feMorphology in="SourceAlpha" operator="erode" radius="18" result="core"/>
     <feComposite in="soft" in2="core" operator="out"/>
    </filter>
   </defs>
  </svg>
  <section id="characterGallery" aria-label="Character showcase">
   <div id="characterStage"></div>
   <div id="characterTargets" aria-label="Choose a character"></div>
   <footer class="showcase-footer">
    <span class="navigation-hint"><span aria-hidden="true">← &nbsp; →</span> Explore <i></i> <span class="keycap">OK</span> Open app</span>
    <button id="showApps" class="section-link" type="button">Your apps <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg></button>
    <span class="section-index" aria-hidden="true"><b>01</b> / 02</span>
   </footer>
  </section>
  <section id="dashboard" aria-label="Applications" aria-hidden="true">
   <div class="dashboard-atmosphere" aria-hidden="true"></div>
  <header>
    <div id="leftBlock">
      <div id="greeting" hidden></div>
      <div id="timeRow">
        <span id="clock"></span><span id="ampm"></span><span class="divider"></span><span id="date"></span>
      </div>
    </div>
    <div id="topButtons">
      <button type="button" class="pill" id="btnInputs" tabindex="-1">
        <svg viewBox="0 0 24 24"><path d="M18,7V4c0,-1.1 -0.9,-2 -2,-2H8C6.9,2 6,2.9 6,4v3H5v6l3,6v3h8v-3l3,-6V7H18zM8,4h8v3h-2V5h-1v2h-2V5h-1v2H8V4z"/></svg>
        <span>Inputs</span>
      </button>
      <button type="button" class="pill" id="btnWifi" tabindex="-1">
        <svg viewBox="0 0 24 24"><path d="M1,9l2,2c4.97,-4.97 13.030,-4.97 18,0l2,-2C16.93,2.93 7.08,2.93 1,9zM9,17l3,3 3,-3c-1.65,-1.66 -4.34,-1.66 -6,0zM5,13l2,2c2.76,-2.76 7.24,-2.76 10,0l2,-2C15.14,9.14 8.87,9.14 5,13z"/></svg>
        <span id="wifiLabel">Wi-Fi</span>
      </button>
      <button type="button" class="pill" id="btnSettings" tabindex="-1">
        <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.030,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.030,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.030,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/></svg>
        <span>Settings</span>
      </button>
    </div>
  </header>
   <div class="dashboard-heading"><button id="showCharacters" type="button" class="section-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 15 7-7 7 7"/></svg> Back to cinema</button><h1>Your apps<span id="appCount"></span></h1></div>
   <div id="viewport"><div id="stage"><div id="tiles"></div></div></div>
   <p id="emptyApps" hidden>No apps available. Run the existing app sync on your computer.</p>
   <footer class="dashboard-footer"><span>Hold <span class="keycap">OK</span> to rearrange <i></i> <span aria-hidden="true">←</span> at row start for settings</span><span id="appPosition"></span><span class="section-index" aria-hidden="true">01 / <b>02</b></span></footer>
  </section>
  <div id="inputsPanel" class="hidden" role="menu" aria-label="Inputs"></div>
  <div id="toast" role="status" aria-live="polite"></div>
 </main>
 <script src="config.js"></script>
 <script src="characters.js"></script>
 <script src="apps.js"></script>
 <script src="app.js"></script>
</body>
</html>
